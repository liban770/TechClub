{% extends 'layouts/base.html' %}

{% block title %}Server Error (500) — TechClub{% endblock %}

{% block content %}
<main class="min-h-[70vh] flex items-center justify-center py-16 px-4">
  <div class="max-w-md w-full text-center space-y-6">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-error-container/20 flex items-center justify-center text-error shadow-sm border border-error/20">
      <span class="material-symbols-outlined text-3xl">error</span>
    </div>
    
    <div>
      <span class="text-xs font-bold font-code uppercase tracking-wider text-error">500 Error</span>
      <h1 class="text-3xl font-extrabold text-primary tracking-tight mt-1">Something went wrong</h1>
      <p class="text-sm text-on-surface-variant mt-2 leading-relaxed">
        Our servers encountered an unexpected issue. Our engineering team has been notified and is looking into it.
      </p>
    </div>

    <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="{% url 'home' %}" class="w-full sm:w-auto px-6 py-2.5 bg-primary text-on-primary rounded-xl text-xs font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">home</span>
        <span>Return to Safety</span>
      </a>
    </div>
  </div>
</main>
{% endblock %}
